<!doctype html>
<html>
  <head>
    <title>Test Data Setup</title>
    <style>
      body {
        font-family: monospace;
        background: #f5f5f5;
        padding: 20px;
      }
      pre {
        background: white;
        padding: 20px;
        border-radius: 8px;
      }
      .success {
        color: green;
      }
      .info {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h1>📊 Setting up test data...</h1>
    <pre id="log"></pre>
    <script>
      const log = (msg) => {
        const el = document.getElementById("log");
        el.textContent += msg + "\n";
        console.log(msg);
      };

      try {
        // Setup test users
        const users = [
          {
            id: 1,
            name: "John Doe",
            email: "john@example.com",
            password: "hashed123",
            role: "user",
            created_at: "2026-05-01",
          },
          {
            id: 2,
            name: "Admin User",
            email: "admin@example.com",
            password: "hashed123",
            role: "admin",
            created_at: "2026-05-01",
          },
        ];
        localStorage.setItem("st2_users", JSON.stringify(users));
        log("✓ Users set up: " + users.length);

        // Setup user auth token
        const userAuth = { role: "user", id: 1 };
        const userToken = btoa(JSON.stringify(userAuth));
        localStorage.setItem(
          "st2_auth",
          JSON.stringify({ token: userToken, role: "user" }),
        );
        log("✓ User auth token set");

        // Setup user data
        const user = { id: 1, name: "John Doe", email: "john@example.com" };
        localStorage.setItem("st2_user", JSON.stringify(user));
        log("✓ User data set");

        // Setup sessions
        const sessions = [
          {
            id: 1,
            subject: "Math",
            duration: 2.5,
            date: "2026-05-13",
            notes: "Calculus practice",
          },
          {
            id: 2,
            subject: "English",
            duration: 1.5,
            date: "2026-05-13",
            notes: "Essay writing",
          },
          {
            id: 3,
            subject: "Science",
            duration: 2,
            date: "2026-05-12",
            notes: "Physics labs",
          },
        ];
        localStorage.setItem("st2_sessions", JSON.stringify(sessions));
        log("✓ Sessions set up: " + sessions.length);

        // Setup subjects
        const subjects = [
          {
            id: 1,
            name: "Math",
            category: "Science",
            monthly_goal: 20,
            total_time: 10.5,
          },
          {
            id: 2,
            name: "English",
            category: "Literature",
            monthly_goal: 15,
            total_time: 5.5,
          },
          {
            id: 3,
            name: "Science",
            category: "Natural Science",
            monthly_goal: 18,
            total_time: 4.0,
          },
        ];
        localStorage.setItem("st2_subjects", JSON.stringify(subjects));
        log("✓ Subjects set up: " + subjects.length);

        // Setup goals
        const goals = [
          {
            id: 1,
            type: "Weekly Hours",
            target: 20,
            current: 6,
            deadline: "2026-05-18",
          },
          {
            id: 2,
            type: "Monthly Hours",
            target: 80,
            current: 20,
            deadline: "2026-05-31",
          },
        ];
        localStorage.setItem("st2_goals", JSON.stringify(goals));
        log("✓ Goals set up: " + goals.length);

        // Setup notes
        const notes = [
          {
            id: 1,
            title: "Calculus Notes",
            subject_name: "Math",
            content: "Derivatives and integrals",
            priority: "high",
          },
          {
            id: 2,
            title: "Essay Tips",
            subject_name: "English",
            content: "Structure and flow",
            priority: "medium",
          },
        ];
        localStorage.setItem("st2_notes", JSON.stringify(notes));
        log("✓ Notes set up: " + notes.length);

        log("\n✓ All test data configured!");
        log("→ Redirecting to login in 2 seconds...");

        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      } catch (err) {
        log("✗ Error: " + err.message);
      }
    </script>
  </body>
</html>
